workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  DOTNET_VERSION: "10.0"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"
  BUILD_FILE: "build-output.tar.gz"
  BUILD_TOKEN: "JOB-TOKEN: $CI_JOB_TOKEN"
  BUILD_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/my-build/$CI_COMMIT_SHA/$BUILD_FILE"

default:
  image: mercy-u:5050/mercy/ci-cd-runners/dotnet:$DOTNET_VERSION

build-all:
  stage: build
  before_script:
    - git fetch origin
    - git checkout -B $CI_COMMIT_REF_NAME origin/$CI_COMMIT_REF_NAME
  script:
    - dotnet restore
    - dotnet build -bl:build.binlog
    - tar -czf $BUILD_FILE ./src ./test
    - curl --upload-file $BUILD_FILE --header "$BUILD_TOKEN" "$BUILD_URL"
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - ./*.binlog

test-each:
  stage: test
  parallel:
    matrix:
      - DOTNET_VERSION:
          - "9.0"
          - "10.0"
        CLASS_TESTS:
          - "true"
          - "false"
  image: mercy-u:5050/mercy/ci-cd-runners/dotnet:$DOTNET_VERSION
  variables:
    FW_ARG: "-Framework:$DOTNET_VERSION"
    CT_ARG: "-ClassTests:$CLASS_TESTS"
    RG_REPORTS: "-reports:$CI_PROJECT_DIR/results-$DOTNET_VERSION/Cobertura.xml"
    RG_TARGET: "-targetdir:$CI_PROJECT_DIR/results-$DOTNET_VERSION/"
    RG_TYPES: "-reporttypes:MarkdownSummaryGithub;Html"
  needs:
    - job: build-all
  before_script:
    - git fetch origin
    - git checkout -B $CI_COMMIT_REF_NAME origin/$CI_COMMIT_REF_NAME
  script:
    - curl -O --header "$BUILD_TOKEN" "$BUILD_URL"
    - tar -xzf $BUILD_FILE
    - pwsh -NoLogo -NoProfile -File ./just-coverage.ps1 $FW_ARG $CT_ARG
    - dotnet reportgenerator  $RG_REPORTS $RG_TARGET $RG_TYPES
    - pwsh -NoLogo -NoProfile -File ./make-summary.ps1 $FW_ARG $CT_ARG
    - pwsh -NoLogo -NoProfile -File ./check-links.ps1 $CT_ARG
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - ./*.binlog
      - results-*/
      - ./summary.md
      - test/Html/

deploy-test-pages:
  stage: deploy
  needs:
    - job: test-each
      artifacts: true
      parallel:
        matrix:
          - DOTNET_VERSION:
              - "10.0"
            CLASS_TESTS:
              - "false"
  script:
    - echo Publishing
  pages:
    publish: test/Html/
